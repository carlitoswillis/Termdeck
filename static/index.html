<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Pinch-zoom stays enabled on purpose: on a phone it's the fastest way to
     read one dense corner of a wide pane. #input-bar uses 16px text so iOS
     doesn't auto-zoom the page when the Send box takes focus. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>termdeck</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2317181c'/><path d='M8 11l5 5-5 5' stroke='%236ea8fe' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M17 21h7' stroke='%23d6d7db' stroke-width='2.5' stroke-linecap='round'/></svg>">
<style>
  :root {
    --bg: #101114;
    --panel: #17181c;
    --border: #26272c;
    --text: #d6d7db;
    --dim: #82848b;
    --accent: #6ea8fe;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.45 -apple-system, system-ui, sans-serif;
    overscroll-behavior: none;
  }
  button {
    font: inherit;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 11px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { background: #202127; }

  /* ---- session list ---- */
  #list-view {
    max-width: 640px;
    margin: 0 auto;
    padding: calc(14px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
  }
  #list-view h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .02em;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  #list-view h1 small { color: var(--dim); font-weight: 400; font-size: 12px; }
  #list-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  #list-actions button { font-size: 13px; }
  #list-actions button:disabled { opacity: .5; }
  .window-label {
    color: var(--dim);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin: 14px 2px 6px;
  }
  .card {
    width: 100%;
    text-align: left;
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .card .title { font-weight: 600; font-size: 14px; }
  .card .meta {
    color: var(--dim);
    font-size: 12px;
    font-family: var(--mono);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .notice {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    color: var(--dim);
    font-size: 13px;
    margin-top: 12px;
  }
  .notice b { color: var(--text); }

  /* ---- terminal view ---- */
  /* Fixed, with its height driven by visualViewport: on a phone the on-screen
     keyboard covers part of the window without changing 100dvh, so a static
     height hides the very lines you're typing at. */
  #term-view {
    display: none;
    flex-direction: column;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
  }
  #term-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  #term-title {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #term-bar button { padding: 5px 9px; font-size: 12px; }
  #term-bar button.on { color: var(--accent); border-color: #3a3c44; }
  #follow, #fit, #reshape { font-size: 14px; line-height: 1; }
  #screen-wrap {
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    background: #0b0c0e;
  }
  #load-earlier {
    display: block;
    margin: 8px auto;
    font-size: 12px;
    color: var(--dim);
  }
  #screen {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.32;
    padding: 4px 8px 8px;
    white-space: pre;
    min-width: 100%;
    width: max-content;
    color: #cfd1d6;
  }
  #screen.wrap { white-space: pre-wrap; word-break: break-all; width: auto; }
  .cursor {
    background: var(--accent);
    color: #0b0c0e;
    animation: blink 1.1s steps(2, start) infinite;
  }
  @keyframes blink { 50% { background: #3a4a63; color: #cfd1d6; } }
  .dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  .dot.new { background: var(--accent); }
  .dot.done { background: #6cc46c; }
  .dot.busy { background: #c9a227; }
  #status {
    flex: none;
    font-size: 11px;
    color: var(--dim);
    padding: 2px 10px;
    border-top: 1px solid var(--border);
    min-height: 17px;
  }
  #keys {
    flex: none;
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 7px 10px;
    border-top: 1px solid var(--border);
    scrollbar-width: none;
  }
  #keys::-webkit-scrollbar { display: none; }
  #keys button {
    flex: none;
    font-size: 12px;
    font-family: var(--mono);
    padding: 6px 10px;
  }
  #keys button.on, #live.on { color: var(--accent); border-color: #3a3c44; }
  #live { flex: none; font-size: 15px; line-height: 1; padding: 6px 10px; }
  #input-bar {
    flex: none;
    display: flex;
    gap: 8px;
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
  }
  #input-bar input {
    flex: 1;
    min-width: 0;
    font: 16px var(--mono);
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 11px;
    outline: none;
  }
  #input-bar input:focus { border-color: #3a3c44; }
  #send { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>

<div id="list-view">
  <h1>termdeck <small id="list-status"></small></h1>
  <div id="list-actions">
    <button id="new-tab">+ Tab</button>
    <button id="new-window">+ Window</button>
  </div>
  <div id="list"></div>
</div>

<div id="term-view">
  <div id="term-bar">
    <button id="back">‹ Back</button>
    <div id="term-title"></div>
    <button id="follow" title="Bring this session to the front on the Mac">⤒</button>
    <button id="fit" title="Size the text so the pane's full width fits">⤢</button>
    <button id="reshape" title="Reshape the pane on the Mac to fit this screen">⇲</button>
    <button id="font-minus">A−</button>
    <button id="font-plus">A+</button>
    <button id="wrap-toggle">Wrap</button>
  </div>
  <div id="screen-wrap">
    <button id="load-earlier">Load earlier</button>
    <pre id="screen"></pre>
  </div>
  <div id="status"></div>
  <div id="keys"></div>
  <div id="input-bar">
    <button id="live" title="Send every keystroke as you type">⌨</button>
    <input id="input" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false" enterkeyhint="send"
           placeholder="Type, then Send (adds ⏎)">
    <button id="send">Send</button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
/* "#ctrl"/"#alt" are latches: tap one, then type any key on the phone's own
   keyboard to send that combination. Everything iOS can't produce lives
   here — it has no Esc, Ctrl, Tab or arrows, and never will. */
const KEYS = [
  ["esc","Esc"],["tab","Tab"],["shift-tab","⇧Tab"],["#ctrl","^"],["#alt","⌥"],
  ["up","↑"],["down","↓"],["left","←"],["right","→"],["enter","⏎"],
  ["ctrl-c","^C"],["ctrl-d","^D"],["ctrl-z","^Z"],["ctrl-r","^R"],
  ["backspace","⌫"],["pgup","PgUp"],["pgdn","PgDn"],
];
const SENTINEL = "⁣";   // invisible, but something Backspace can delete

const CHUNK = 400;        // lines per "Load earlier" request
const MAX_GAP = 5000;     // bigger gaps aren't worth stitching back together
const MAX_HISTORY = 20000;// keep the DOM from growing without bound

let ws = null, currentId = null, currentTitle = "", lastId = null;
const titles = {};        // session id -> title, for resolving a deep link
/* `hist` holds the lines we currently display; `histStart` is the iTerm2
   line number of hist[0], and `firstLine` the oldest line iTerm2 still has. */
let hist = [], histStart = 0, firstLine = 0, totalLines = 0;
let pendingFrame = null, applying = false, loading = false;
let follow = localStorage.getItem("follow") !== "0";   // on unless turned off
let fit = localStorage.getItem("fit") === "1";
let cols = 0;             // the pane's size in cells, from the last frame
let rows = 0, paneCols = 0, paneRows = 0, reshaped = false, cursor = null;
/* What each session's line count was when we last looked at it, and which
   ones were busy last time the list refreshed. */
let seen = JSON.parse(localStorage.getItem("seen") || "{}");
let wasBusy = {}, finished = {};
let pendingActivate = false;
let fontSize = +(localStorage.getItem("fontSize") || 12);
let listTimer = null;

/* ---------------- session list ---------------- */
async function refreshList() {
  try {
    const r = await fetch("/api/sessions");
    const data = await r.json();
    if (!r.ok) {
      $("list").innerHTML = "";
      $("list-status").textContent = "";
      showNotice(data);
      return;
    }
    $("list-status").textContent = new Date().toLocaleTimeString();
    render(data.windows || []);
  } catch (e) {
    showNotice({message: String(e)});
  }
}
function showNotice(err) {
  const n = document.createElement("div");
  n.className = "notice";
  const bold = text => {
    const b = document.createElement("b");
    b.textContent = text;
    return b;
  };
  if (err.hint) n.append(bold("iTerm2 API unreachable."), document.createElement("br"), err.hint);
  else if (err.plain) n.textContent = err.message;
  else n.append(bold("Error:"), " " + (err.message || "unknown"));
  $("list").replaceChildren(n);
}
function markSeen(id, total) {
  if (!id || !total) return;
  seen[id] = total;
  finished[id] = false;
  localStorage.setItem("seen", JSON.stringify(seen));
}
/* What this pane wants you to know, at a glance:
   busy   — still running something
   done   — was running, now back at a prompt: it finished while you were away
   new    — printed something since you last looked at it */
function activityOf(s) {
  if (wasBusy[s.id] && !s.busy) finished[s.id] = true;
  wasBusy[s.id] = s.busy;
  if (seen[s.id] === undefined) seen[s.id] = s.lines;   // first sighting
  if (finished[s.id]) return ["done", "finished"];
  if (s.busy) return ["busy", s.job];
  if (s.lines > seen[s.id]) return ["new", "new output"];
  return [null, ""];
}

function render(windows) {
  const frag = document.createDocumentFragment();
  let count = 0;
  windows.forEach(w => {
    const label = document.createElement("div");
    label.className = "window-label";
    label.textContent = `Window ${w.index + 1}`;
    frag.appendChild(label);
    w.tabs.forEach(tab => {
      tab.sessions.forEach(s => {
        count++;
        titles[s.id] = s.title;
        const card = document.createElement("button");
        card.className = "card";
        const [mark, note] = activityOf(s);
        const meta = [note || s.job, s.path.replace(/^\/Users\/[^/]+/, "~"),
                      s.tty.replace("/dev/", "")].filter(Boolean).join(" · ");
        card.innerHTML = `<div class="title"></div><div class="meta"></div>`;
        const title = card.querySelector(".title");
        if (mark) {
          const dot = document.createElement("span");
          dot.className = "dot " + mark;
          title.appendChild(dot);
        }
        title.appendChild(document.createTextNode(`Tab ${tab.index + 1} — ${s.title}`));
        card.querySelector(".meta").textContent = meta;
        card.onclick = () => openSession(s.id, s.title);
        frag.appendChild(card);
      });
    });
  });
  if (!count) {
    const n = document.createElement("div");
    n.className = "notice";
    n.textContent = "No iTerm2 sessions found.";
    frag.appendChild(n);
  }
  $("list").replaceChildren(frag);
}

/* A new tab lands in the window of whatever you were last looking at, so the
   phone keeps working where you left off. */
async function createSession(kind) {
  const btn = $(kind === "tab" ? "new-tab" : "new-window");
  btn.disabled = true;
  try {
    const r = await fetch("/api/new", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({kind, session_id: lastId}),
    });
    const data = await r.json();
    if (r.ok) openSession(data.session_id, data.title);
    else showNotice(data);
  } catch (e) {
    showNotice({message: String(e)});
  } finally {
    btn.disabled = false;
  }
}

/* ---------------- routing ----------------
   Each session gets its own URL (#s=<session id>), so a refresh — or a
   home-screen shortcut, or a link you send yourself — reopens that session
   instead of dumping you back on the picker. Session ids survive reopening
   the page; window/tab numbers don't, which is why they aren't in the URL. */
function hashSession() {
  const m = location.hash.match(/^#s=(.+)$/);
  return m ? decodeURIComponent(m[1]) : null;
}
function pushSession(id) {
  const url = id ? "#s=" + encodeURIComponent(id) : location.pathname + location.search;
  if (hashSession() !== id) history.pushState({id}, "", url);
}
window.addEventListener("popstate", () => {
  const id = hashSession();
  if (id && id !== currentId) openSession(id, titles[id] || "session", false);
  else if (!id && currentId) closeSession(false);
});

/* ---------------- terminal view ---------------- */
function openSession(id, title, push = true) {
  if (push) pushSession(id);
  document.title = title + " · termdeck";
  currentId = id; currentTitle = title; lastId = id;
  hist = []; histStart = 0; firstLine = 0; totalLines = 0; pendingFrame = null;
  pendingActivate = follow;   // only on a deliberate open, never on reconnect
  paneCols = 0; paneRows = 0; reshaped = false; cursor = null;
  finished[id] = false;
  $("reshape").classList.remove("on");
  $("term-title").textContent = title;
  $("screen").textContent = "";
  $("status").textContent = "connecting…";
  $("list-view").style.display = "none";
  $("term-view").style.display = "flex";
  latch = null; paintLatches();
  fitViewport();
  clearInterval(listTimer);
  connect();
}
function closeSession(push = true) {
  if (push) pushSession(null);
  document.title = "termdeck";
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  currentId = null;
  $("term-view").style.display = "none";
  $("list-view").style.display = "block";
  refreshList();
  clearInterval(listTimer);
  listTimer = setInterval(refreshList, 5000);
}
function connect() {
  if (!currentId) return;
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/api/ws`);
  ws.onopen = () => {
    ws.send(JSON.stringify({type: "watch", session_id: currentId}));
    if (pendingActivate) { pendingActivate = false; sendActivate(); }
  };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "screen") {
      pendingFrame = m;
      drain();
    } else if (m.type === "activated") {
      $("status").textContent = `${currentTitle} · brought to front`;
    } else if (m.type === "gone") {
      // Keep the last output on screen to read, but drop the session from the
      // URL so a refresh doesn't try to reopen something that's dead.
      $("status").textContent = "session closed — tap ‹ Back";
      history.replaceState({}, "", location.pathname + location.search);
    } else if (m.type === "error") {
      $("status").textContent = m.hint || m.message;
    }
  };
  ws.onclose = () => {
    if (!currentId) return;
    $("status").textContent = "reconnecting…";
    setTimeout(connect, 1500);
  };
}
/* ---------------- colour ----------------
   Runs arrive as [cells, fg, bg, flags]; fg/bg are a 0-255 palette index, a
   "#rrggbb" string, or null for the terminal's default. */
const ANSI16 = ["#2e3436","#cc0000","#4e9a06","#c4a000","#3465a4","#75507b",
                "#06989a","#d3d7cf","#555753","#ef2929","#8ae234","#fce94f",
                "#729fcf","#ad7fa8","#34e2e2","#eeeeec"];
const CUBE = [0, 95, 135, 175, 215, 255];
const DEFAULT_FG = "#cfd1d6", DEFAULT_BG = "#0b0c0e";
const B_BOLD = 1, B_ITALIC = 2, B_UNDERLINE = 4, B_INVERSE = 8, B_FAINT = 16,
      B_STRIKE = 32;

function colorOf(c) {
  if (c === null || c === undefined) return null;
  if (typeof c === "string") return c;
  if (c < 16) return ANSI16[c];
  if (c < 232) {
    const i = c - 16;
    return `rgb(${CUBE[(i / 36 | 0) % 6]},${CUBE[(i / 6 | 0) % 6]},${CUBE[i % 6]})`;
  }
  const g = 8 + (c - 232) * 10;
  return `rgb(${g},${g},${g})`;
}
const esc = s => s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));

function segmentHTML(text, fg, bg, flags) {
  let color = colorOf(fg), background = colorOf(bg);
  if (flags & B_INVERSE) {
    const swap = color || DEFAULT_FG;
    color = background || DEFAULT_BG;
    background = swap;
  }
  const css = [], lines = [];
  if (color) css.push("color:" + color);
  if (background) css.push("background:" + background);
  if (flags & B_BOLD) css.push("font-weight:600");
  if (flags & B_ITALIC) css.push("font-style:italic");
  if (flags & B_UNDERLINE) lines.push("underline");
  if (flags & B_STRIKE) lines.push("line-through");
  if (lines.length) css.push("text-decoration:" + lines.join(" "));
  if (flags & B_FAINT) css.push("opacity:.65");
  return css.length ? `<span style="${css.join(";")}">${esc(text)}</span>` : esc(text);
}
const cursorHTML = ch => `<span class="cursor">${esc(ch || " ")}</span>`;

/* `col` is where the cursor sits on this line, or -1. It has to be spliced
   into whatever run covers it, so styling and the cursor coexist. */
function rowHTML(row, col = -1) {
  const text = row.t;
  if (!row.r) {
    if (col < 0) return esc(text);
    return esc(text.slice(0, col)) + cursorHTML(text[col]) +
           esc(text.slice(col + 1));
  }
  let out = "", at = 0;
  for (const [cells, fg, bg, flags] of row.r) {
    const end = at + cells;
    if (col >= at && col < end) {
      out += segmentHTML(text.slice(at, col), fg, bg, flags) +
             cursorHTML(text[col]) +
             segmentHTML(text.slice(col + 1, end), fg, bg, flags);
    } else {
      const seg = text.slice(at, end);
      if (seg) out += segmentHTML(seg, fg, bg, flags);
    }
    at = end;
  }
  if (at < text.length) {
    out += col >= at
      ? esc(text.slice(at, col)) + cursorHTML(text[col]) + esc(text.slice(col + 1))
      : esc(text.slice(at));
  } else if (col >= at) {
    // Past the end of the line — the usual case at a prompt.
    out += esc(" ".repeat(col - at)) + cursorHTML(" ");
  }
  return out;
}
/* One frame's lines as rows: text plus its style runs, if it has any. */
function rowsOf(m) {
  const styles = m.styles || {};
  return m.lines.map((t, i) => ({t, r: styles[i] || null}));
}

/* Frames arrive faster than a gap-fill fetch completes, so apply them one at
   a time and only ever keep the newest one waiting. */
function drain() {
  if (applying) return;
  applying = true;
  (async () => {
    try {
      while (pendingFrame) {
        const m = pendingFrame;
        pendingFrame = null;
        await applyFrame(m);
      }
    } finally { applying = false; }
  })();
}
async function applyFrame(m) {
  firstLine = m.first || 0;
  totalLines = m.total;
  if (m.rows) rows = m.rows;
  cursor = m.cursor || null;
  if (m.total) markSeen(currentId, m.total);
  if (m.cols && m.cols !== cols) { cols = m.cols; applyFit(); }
  // Remember the shape the pane had before we touched it.
  if (m.cols && !paneCols && !reshaped) { paneCols = m.cols; paneRows = m.rows; }
  const histEnd = histStart + hist.length;
  if (hist.length && m.start > histEnd) {
    // Output scrolled past the tail window since the last frame; fetch what
    // we missed so the scrollback stays continuous.
    const gap = m.start - histEnd;
    const filled = gap <= MAX_GAP ? await fetchRange(histEnd, gap) : null;
    if (filled && filled.start === histEnd && filled.lines.length === gap) {
      hist = hist.concat(rowsOf(filled));
    } else {
      hist = [];   // can't stitch — fall back to showing just the live tail
    }
  }
  if (!hist.length || m.start < histStart) {
    hist = rowsOf(m);
    histStart = m.start;
  } else {
    hist.length = m.start - histStart;
    hist = hist.concat(rowsOf(m));
  }
  if (hist.length > MAX_HISTORY) {
    histStart += hist.length - MAX_HISTORY;
    hist = hist.slice(-MAX_HISTORY);
  }
  updateScreen();
  $("status").textContent = `${currentTitle} · ${totalLines} lines`;
}
async function fetchRange(start, count) {
  if (!currentId || count <= 0) return null;
  try {
    const r = await fetch("/api/scrollback?session_id=" +
      encodeURIComponent(currentId) + `&start=${start}&count=${count}`);
    return r.ok ? await r.json() : null;
  } catch (e) {
    return null;
  }
}
function updateScreen() {
  const wrap = $("screen-wrap");
  const pinned = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 60;
  $("screen").innerHTML = hist.map((row, i) => rowHTML(
    row, cursor && cursor[0] === histStart + i ? cursor[1] : -1)).join("\n");
  $("load-earlier").style.display = histStart > firstLine ? "block" : "none";
  if (pinned) wrap.scrollTop = wrap.scrollHeight;
}
async function loadEarlier() {
  if (loading || !currentId || histStart <= firstLine) return;
  loading = true;
  $("load-earlier").textContent = "Loading…";
  try {
    const count = Math.min(CHUNK, histStart - firstLine);
    const data = await fetchRange(histStart - count, count);
    if (data && data.lines.length &&
        data.start + data.lines.length === histStart) {
      const wrap = $("screen-wrap"), before = wrap.scrollHeight;
      hist = rowsOf(data).concat(hist);
      histStart = data.start;
      firstLine = data.first || 0;
      updateScreen();
      wrap.scrollTop += wrap.scrollHeight - before;   // keep the view in place
    }
  } finally {
    loading = false;
    $("load-earlier").textContent = "Load earlier";
  }
}
function sendText(text) {
  if (text && ws && ws.readyState === 1) ws.send(JSON.stringify({type: "input", text}));
}
function sendInput() {
  const box = $("input");
  if (live) { sendText("\r"); return; }
  sendText(box.value + "\r");
  box.value = "";
  lastValue = "";
}
function sendKey(name) {
  latch = null; paintLatches();      // a row key is itself the key you meant
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({type: "key", name}));
}

/* ---------------- keyboard ----------------
   Software keyboards don't report usable keydown events — most keys arrive as
   "Unidentified" because of predictive text — so watch the field's value
   change and send the difference instead. */
let latch = null, live = false, lastValue = "";

function paintLatches() {
  $("k-ctrl").classList.toggle("on", latch === "ctrl");
  $("k-alt").classList.toggle("on", latch === "alt");
}
function setLatch(kind) {
  latch = latch === kind ? null : kind;
  paintLatches();
  $("input").focus();                // keep the keyboard up for the next key
}
function controlChar(c) {
  const u = c.toUpperCase();
  if (u >= "A" && u <= "Z") return String.fromCharCode(u.charCodeAt(0) - 64);
  return {"[": "\x1b", "\\": "\x1c", "]": "\x1d", "^": "\x1e", "_": "\x1f",
          "?": "\x7f", " ": "\x00"}[c] || null;
}
/* Consume the latch against one typed character. */
function latched(ch) {
  const text = latch === "ctrl" ? controlChar(ch) : "\x1b" + ch;
  latch = null;
  paintLatches();
  return text;
}
function onInput() {
  const box = $("input");
  if (live) {
    const v = box.value;
    if (v.length > SENTINEL.length) {
      const added = v.startsWith(SENTINEL) ? v.slice(SENTINEL.length)
                                           : v.replace(SENTINEL, "");
      sendText(latch && added ? latched(added[0]) + added.slice(1) : added);
    } else if (v.length < SENTINEL.length) {
      sendText("\x7f");              // backspace ate the sentinel
    }
    box.value = SENTINEL;
    return;
  }
  if (latch && box.value.length > lastValue.length) {
    // Pull the character back out of the box and send it as a combination.
    const ch = box.value[box.value.length - 1];
    box.value = lastValue;
    sendText(latched(ch));
    return;
  }
  lastValue = box.value;
}
function setLive(on) {
  live = on;
  const box = $("input");
  $("live").classList.toggle("on", on);
  $("send").textContent = on ? "⏎" : "Send";
  box.placeholder = on ? "keys go straight through" : "Type, then Send (adds ⏎)";
  box.value = on ? SENTINEL : "";
  lastValue = box.value;
  if (on) box.focus();
}

/* The on-screen keyboard covers the window without shrinking 100dvh, so drive
   the height from visualViewport instead. */
const vv = window.visualViewport;
let lastViewportHeight = vv ? vv.height : 0;
function fitViewport() {
  if (!currentId) return;
  const view = $("term-view"), wrap = $("screen-wrap");
  const height = vv ? vv.height : innerHeight;
  const opening = height < lastViewportHeight - 40;   // keyboard just appeared
  lastViewportHeight = height;
  view.style.height = height + "px";
  view.style.top = (vv ? vv.offsetTop : 0) + "px";
  applyFit();
  if (opening) wrap.scrollTop = wrap.scrollHeight;
}
if (vv) {
  vv.addEventListener("resize", fitViewport);
  vv.addEventListener("scroll", fitViewport);
}
function sendActivate() {
  if (ws && ws.readyState === 1 && currentId) ws.send(JSON.stringify({type: "activate"}));
}

/* ---------------- wire up ---------------- */
$("back").onclick = () => closeSession();
$("new-tab").onclick = () => createSession("tab");
$("new-window").onclick = () => createSession("window");
$("send").onclick = sendInput;
$("live").onclick = () => setLive(!live);
$("input").addEventListener("input", onInput);
$("input").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); sendInput(); }
  // Hardware keyboards report these properly; software ones go through onInput.
  else if (live && e.key === "Backspace") { e.preventDefault(); sendText("\x7f"); }
  else if (live && e.key === "Tab") { e.preventDefault(); sendText("\t"); }
  else if (live && e.key.startsWith("Arrow")) {
    e.preventDefault();
    sendKey(e.key.slice(5).toLowerCase());
  }
});
$("load-earlier").onclick = loadEarlier;
function setFont(size, persist = true) {
  fontSize = Math.min(20, Math.max(6, size));
  $("screen").style.fontSize = fontSize + "px";
  if (persist) localStorage.setItem("fontSize", fontSize);
}
/* Width of one character per 1px of font-size, measured once from the actual
   font rather than assumed. */
function charRatio() {
  if (!charRatio.cached) {
    const probe = document.createElement("span");
    probe.style.cssText = "position:absolute;visibility:hidden;white-space:pre;" +
      "font-family:var(--mono);font-size:100px";
    probe.textContent = "M".repeat(50);
    document.body.appendChild(probe);
    charRatio.cached = probe.getBoundingClientRect().width / 50 / 100;
    probe.remove();
  }
  return charRatio.cached;
}
/* Shrink text until the pane's full width fits the screen. Uses the pane's
   real column count, so a narrow split doesn't get sized as if it were 200
   columns wide. */
function applyFit() {
  if (!fit || !cols) return;
  const avail = $("screen-wrap").clientWidth - 16;   // #screen padding
  setFont(Math.floor(avail / (cols * charRatio())), false);
}
/* The honest fix for a phone: make the pane the size this screen can show,
   instead of shrinking 120 columns into 6px text. Reverts on a second tap —
   and the server puts it back anyway when this socket closes. */
function toggleReshape() {
  if (!currentId || !ws || ws.readyState !== 1) return;
  if (reshaped) {
    if (paneCols) ws.send(JSON.stringify({type: "resize", cols: paneCols, rows: paneRows}));
    reshaped = false;
  } else {
    const width = $("screen-wrap").clientWidth - 16;
    const height = $("screen-wrap").clientHeight - 12;
    const wanted = Math.floor(width / (fontSize * charRatio()));
    const tall = Math.floor(height / (fontSize * 1.32));   // CSS line-height
    if (!paneCols) { paneCols = cols; paneRows = rows; }
    ws.send(JSON.stringify({type: "resize", cols: wanted, rows: tall}));
    reshaped = true;
  }
  $("reshape").classList.toggle("on", reshaped);
}
function setFit(on) {
  fit = on;
  localStorage.setItem("fit", on ? "1" : "0");
  $("fit").classList.toggle("on", on);
  if (on) { setWrap(false); applyFit(); }
  else setFont(+(localStorage.getItem("fontSize") || 12));
}
$("fit").onclick = () => setFit(!fit);
$("reshape").onclick = toggleReshape;
addEventListener("resize", applyFit);          // rotation, or a resized window
$("font-minus").onclick = () => { setFit(false); setFont(fontSize - 1); };
$("font-plus").onclick = () => { setFit(false); setFont(fontSize + 1); };
function setWrap(on) {
  $("screen").classList.toggle("wrap", on);
  localStorage.setItem("wrap", on ? "1" : "");
}
/* Wrapping and fitting answer the same question two ways — turning one on
   turns the other off. */
$("wrap-toggle").onclick = () => {
  const on = !$("screen").classList.contains("wrap");
  if (on) setFit(false);
  setWrap(on);
};
function setFollow(on) {
  follow = on;
  localStorage.setItem("follow", on ? "1" : "0");
  $("follow").classList.toggle("on", on);
}
/* Turning it on also brings the session you're watching to the front now, so
   it doubles as a one-shot when you've left it off. */
$("follow").onclick = () => { setFollow(!follow); if (follow) sendActivate(); };
setFont(fontSize);
setWrap(!!localStorage.getItem("wrap"));
setFollow(follow);
setFit(fit);
setLive(false);   // never persisted: compose is the safer thing to wake up in
KEYS.forEach(([name, label]) => {
  const b = document.createElement("button");
  b.textContent = label;
  if (name.startsWith("#")) {
    b.id = "k-" + name.slice(1);
    b.title = (name === "#ctrl" ? "Ctrl" : "Alt") + " + the next key you type";
    b.onclick = () => setLatch(name.slice(1));
  } else {
    b.onclick = () => sendKey(name);
  }
  $("keys").appendChild(b);
});

/* Phones freeze the page (and the websocket) when it goes to the background. */
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  if (currentId) {
    if (!ws || ws.readyState > WebSocket.OPEN) connect();
  } else {
    refreshList();
  }
});

/* Land on the session in the URL, if there is one. */
async function boot() {
  const id = hashSession();
  await refreshList();
  listTimer = setInterval(refreshList, 5000);
  if (!id) return;
  if (titles[id] || !Object.keys(titles).length) {
    // Unknown titles means the list didn't load, not that the session died —
    // still try, and let the terminal view report what's actually wrong.
    openSession(id, titles[id] || "session", false);
  } else {
    history.replaceState({}, "", location.pathname + location.search);
    showNotice({message: "That session is gone.", plain: true});
  }
}
boot();
</script>
</body>
</html>
